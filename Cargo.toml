[workspace]
resolver = "3"
members = [
  "crates/antik-domain",
  "crates/antik-app",
  "crates/antik-infra",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
antik-domain = { path = "crates/antik-domain" }
antik-app = { path = "crates/antik-app" }
antik-infra = { path = "crates/antik-infra" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
ulid = { version = "3.0", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
# Loopback HTTP only: the TLS stack is not compiled in, because no model lane
# may leave this machine.
ureq = { version = "3.5", default-features = false }

specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

tauri = "2.12.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
